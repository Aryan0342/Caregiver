workflows:
  ios-production:
    name: iOS + Apple Watch Production Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Steph van Hoffe
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic fetches profiles for both the iPhone bundle and matching
        # child bundles such as com.je-dag-in-beeld.caregiver.watchkitapp.
        distribution_type: app_store
        bundle_identifier: com.je-dag-in-beeld.caregiver
      vars:
        APP_ID: com.je-dag-in-beeld.caregiver
        BUNDLE_ID: com.je-dag-in-beeld.caregiver
        WATCH_BUNDLE_ID: com.je-dag-in-beeld.caregiver.watchkitapp
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Ensure Apple Watch signing assets
        script: |
          set -e

          WATCH_BUNDLE_RESOURCE_ID=$(
            app-store-connect bundle-ids list \
              --bundle-id-identifier "$WATCH_BUNDLE_ID" \
              --strict-match-identifier \
              --json | jq -r '.[0].id // empty'
          )

          if [ -z "$WATCH_BUNDLE_RESOURCE_ID" ]; then
            app-store-connect bundle-ids create \
              "$WATCH_BUNDLE_ID" \
              --name "Caregiver Apple Watch" \
              --platform IOS

            WATCH_BUNDLE_RESOURCE_ID=$(
              app-store-connect bundle-ids list \
                --bundle-id-identifier "$WATCH_BUNDLE_ID" \
                --strict-match-identifier \
                --json | jq -r '.[0].id // empty'
            )
          fi

          if [ -z "$WATCH_BUNDLE_RESOURCE_ID" ]; then
            echo "Unable to resolve the Apple Watch bundle identifier in Apple Developer Portal"
            exit 1
          fi

          WATCH_PROFILE_NAME="Caregiver Apple Watch App Store"
          EXISTING_PROFILE=$(
            app-store-connect profiles list \
              --type IOS_APP_STORE \
              --state ACTIVE \
              --name "$WATCH_PROFILE_NAME" \
              --save
          )

          if ! echo "$EXISTING_PROFILE" | grep -Fq "$WATCH_PROFILE_NAME"; then
            CERTIFICATE_IDS=$(
              app-store-connect certificates list \
                --type DISTRIBUTION IOS_DISTRIBUTION \
                --json | jq -r '.[].id' | tr '\n' ' '
            )

            if [ -z "$CERTIFICATE_IDS" ]; then
              echo "No active Apple Distribution certificate is available"
              exit 1
            fi

            app-store-connect profiles create \
              "$WATCH_BUNDLE_RESOURCE_ID" \
              --certificate-ids $CERTIFICATE_IDS \
              --type IOS_APP_STORE \
              --name "$WATCH_PROFILE_NAME" \
              --save
          fi

      - name: Verify Apple Watch target
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme CaregiverWatch \
            -configuration Release \
            -sdk watchos \
            -showBuildSettings > /tmp/caregiver-watch-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $WATCH_BUNDLE_ID" /tmp/caregiver-watch-build-settings.txt

      - name: Compile Apple Watch for simulator
        script: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme CaregiverWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/caregiver-watch-simulator-build.log

      - name: Apply iPhone and Watch provisioning profiles
        script: xcode-project use-profiles

      - name: Analyze Flutter application
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Strictly analyze Watch integration
        script: |
          flutter analyze \
            lib/models/watch_session_snapshot.dart \
            lib/services/watch_session_service.dart \
            lib/screens/client_mode_session_screen.dart \
            test/watch_session_snapshot_test.dart

      - name: Run Flutter tests
        script: flutter test

      - name: Build signed iPhone and Apple Watch archive
        script: |
          flutter build ipa \
            --release \
            --export-options-plist="$HOME/export_options.plist"

      - name: Verify Watch app is embedded in archive
        script: |
          WATCH_APP=$(find build/ios/archive -type d -path "*/Products/Applications/*.app/Watch/CaregiverWatch.app" -print -quit)
          if [ -z "$WATCH_APP" ]; then
            echo "CaregiverWatch.app is missing from the iPhone archive"
            exit 1
          fi
          echo "Embedded watch app: $WATCH_APP"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/caregiver-watch-build-settings.txt
      - /tmp/caregiver-watch-simulator-build.log

    publishing:
      email:
        recipients:
          - syedasadullahkazmik@gmail.com
        notify:
          success: true
          failure: true
